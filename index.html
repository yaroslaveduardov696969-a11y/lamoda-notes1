<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ламода</title>
<style>
  :root,
  [data-theme="light"] {
    --bg: #eaf2fb;
    --surface: #ffffff;
    --surface-2: #dce9f7;
    --text: #132a44;
    --text-muted: #5a7a9e;
    --border: #c5d8ee;
    --accent: #1a73e8;
    --accent-hover: #1558b8;
    --pin: #ffb700;
    --danger: #d93025;
    --mark: #ffe58f;
    --shadow: 0 1px 3px rgba(19, 42, 68, .1);
    --shadow-hover: 0 4px 14px rgba(19, 42, 68, .16);
    --star-opacity: .2;
    --scroll-offset: 90px;
  }
  [data-theme="dark"] {
    --bg: #0b0b1a;
    --surface: #1c1c2e;
    --surface-2: #262640;
    --text: #f5f5f7;
    --text-muted: #9898b0;
    --border: #2e2e4a;
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --pin: #ffd60a;
    --danger: #ff453a;
    --mark: #6b5a00;
    --shadow: 0 1px 3px rgba(0,0,0,.5);
    --shadow-hover: 0 4px 14px rgba(0,0,0,.7);
    --star-opacity: 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .stars, .stars2, .stars3 {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--star-opacity); transition: opacity .3s;
  }
  .stars {
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 160px 120px, #fff, transparent),
      radial-gradient(1px 1px at 230px 80px, #fff, transparent),
      radial-gradient(1px 1px at 300px 160px, #fff, transparent),
      radial-gradient(1px 1px at 380px 60px, #fff, transparent),
      radial-gradient(1px 1px at 450px 140px, #fff, transparent),
      radial-gradient(1px 1px at 520px 20px, #fff, transparent),
      radial-gradient(1px 1px at 600px 180px, #fff, transparent);
    background-repeat: repeat; background-size: 650px 200px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars2 {
    background-image:
      radial-gradient(1.5px 1.5px at 50px 50px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 200px 130px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 350px 70px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 500px 170px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 650px 30px, #cfe8ff, transparent);
    background-repeat: repeat; background-size: 750px 220px;
    animation: twinkle 6s ease-in-out infinite alternate-reverse;
  }
  .stars3 {
    background-image:
      radial-gradient(2px 2px at 120px 90px, #ffffff, transparent),
      radial-gradient(2px 2px at 420px 150px, #ffffff, transparent),
      radial-gradient(2px 2px at 700px 40px, #ffffff, transparent);
    background-repeat: repeat; background-size: 900px 260px;
    animation: twinkle 8s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: calc(var(--star-opacity) * .6); }
    100% { opacity: var(--star-opacity); }
  }

  .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

  aside.sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1rem .75rem;
    position: sticky; top: 0; align-self: flex-start;
    height: 100vh; overflow-y: auto;
    z-index: 5;
    transition: width .2s, padding .2s;
  }
  .sidebar h3 {
    font-size: .72rem; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .06em;
    margin: .25rem .35rem .5rem;
  }
  .sidebar ul { list-style: none; margin: 0; padding: 0; }
  .sidebar li { margin-bottom: .15rem; }
  .sidebar .block-row {
    display: flex; align-items: center; gap: .1rem;
    border-radius: 8px; padding: .1rem .2rem;
  }
  .sidebar .block-row:hover { background: var(--surface-2); }
  .sidebar .block-link {
    flex: 1; display: flex; justify-content: space-between; align-items: center;
    padding: .4rem .5rem; border-radius: 8px; border: none; background: transparent;
    color: var(--text); font-size: .9rem; text-align: left;
    cursor: pointer; transition: background .15s; min-width: 0;
  }
  .sidebar .block-link .block-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .sidebar .block-link .count { font-size: .72rem; opacity: .7; margin-left: .35rem; flex-shrink: 0; }
  .sidebar .block-btn {
    background: transparent; border: none; color: var(--text-muted);
    cursor: pointer; font-size: .78rem; padding: .2rem .3rem;
    border-radius: 4px; flex-shrink: 0; opacity: .55;
  }
  .sidebar .block-btn:hover { opacity: 1; background: var(--border); }
  .sidebar .block-btn.del-block:hover { color: var(--danger); }
  .sidebar .add-block {
    width: 100%; margin-top: .5rem; padding: .45rem .6rem; border-radius: 8px;
    border: 1px dashed var(--border); background: transparent;
    color: var(--text-muted); font-size: .85rem; cursor: pointer;
  }
  .sidebar .add-block:hover { border-color: var(--accent); color: var(--accent); }

  body.sidebar-collapsed aside.sidebar {
    width: 0; padding: 0; border-right: none; overflow: hidden;
  }
  body.sidebar-collapsed aside.sidebar > * { display: none; }

  .main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.5rem;
    display: grid;
    grid-template-columns: auto auto 1fr auto auto auto;
    grid-template-areas: "toggle logo search token theme new";
    gap: .5rem .75rem; align-items: center;
    box-shadow: var(--shadow);
  }
  header > #sidebarToggleBtn { grid-area: toggle; }
  header > .logo            { grid-area: logo; }
  header > .search-wrap     { grid-area: search; }
  header > .token-wrap      { grid-area: token; }
  header > #themeBtn        { grid-area: theme; }
  header > .new-wrap        { grid-area: new; }

  .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; }

  .search-wrap { display: flex; gap: .5rem; min-width: 0; }
  .search-input-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
  }
  .search-input-wrap input {
    width: 100%;
    padding: .5rem 2rem .5rem .75rem; /* правый отступ под крестик */
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text);
    font-size: .95rem; outline: none;
  }
  .search-input-wrap input:focus { border-color: var(--accent); }
  .search-clear-btn {
    position: absolute;
    right: .35rem;
    top: 50%;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: .95rem;
    line-height: 1;
    padding: 0;
  }
  .search-clear-btn:hover { background: var(--border); color: var(--text); }
  .search-clear-btn.show { display: inline-flex; }

  .search-wrap select {
    flex: 0 0 auto;
    padding: .5rem .6rem; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font-size: .9rem; cursor: pointer;
    max-width: 180px;
  }

  .token-wrap { display: flex; gap: .25rem; align-items: center; min-width: 0; }
  .token-wrap input {
    width: 150px; min-width: 0;
    padding: .4rem .6rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text);
    font-size: .82rem; outline: none;
  }
  .token-wrap input:focus { border-color: var(--accent); }

  .btn {
    padding: .5rem .9rem; border-radius: 8px; border: none;
    background: var(--accent); color: #fff;
    font-size: .9rem; font-weight: 500; cursor: pointer;
    transition: background .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.small { padding: .35rem .6rem; font-size: .8rem; }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.ghost:hover { background: var(--border); }
  .icon-btn {
    width: 36px; height: 36px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.1rem; border-radius: 8px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); cursor: pointer;
    transition: background .15s, color .15s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--border); }

  .new-wrap { position: relative; }
  .new-menu {
    position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow-hover);
    min-width: 240px; padding: .3rem; display: none; z-index: 20;
  }
  .new-menu.show { display: block; }
  .new-menu button {
    display: block; width: 100%; text-align: left;
    padding: .55rem .7rem; border: none; background: transparent;
    color: var(--text); font-size: .9rem; border-radius: 6px; cursor: pointer;
  }
  .new-menu button:hover { background: var(--surface-2); }

  main { padding: 1.25rem 1.5rem 3rem; max-width: 1280px; width: 100%; margin: 0 auto; }
  h2 {
    font-size: .95rem; font-weight: 600; color: var(--text-muted);
    margin: 1.25rem 0 .75rem; text-transform: uppercase; letter-spacing: .04em;
    scroll-margin-top: var(--scroll-offset);
  }
  h2:first-child { margin-top: 0; }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }

  #pinnedList {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: .65rem;
  }
  #pinnedList .note-card { padding: .6rem .7rem; border-radius: 10px; gap: .3rem; }
  #pinnedList .note-title { font-size: .88rem; padding: .15rem; }
  #pinnedList .note-content { font-size: .78rem; line-height: 1.35; min-height: 2.5em; padding: .15rem; }
  #pinnedList .note-footer { font-size: .68rem; padding-top: .15rem; }
  #pinnedList .note-actions .icon-btn { width: 24px; height: 24px; font-size: .8rem; }

  /* Отступ между закреплёнными и первым блоком («Несортированные») */
  #pinnedSection {
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .block-section {
    margin-bottom: 2.25rem;
    margin-top: 1.5rem;
    scroll-margin-top: var(--scroll-offset);
  }
  .block-section:first-child { margin-top: 1.5rem; }
  .block-section.search-results h2 { color: var(--accent); }

  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: .9rem 1rem;
    display: flex; flex-direction: column; gap: .5rem;
    box-shadow: var(--shadow);
    transition: box-shadow .2s, border-color .2s;
    position: relative;
    cursor: pointer;
  }
  .note-card:hover { box-shadow: var(--shadow-hover); }

  .note-title {
    font-weight: 600; font-size: 1.05rem;
    border: none; outline: none; background: transparent;
    color: var(--text); width: 100%; padding: .2rem;
    border-radius: 6px;
  }
  .note-content {
    border: none; outline: none; background: transparent;
    color: var(--text); width: 100%;
    font-family: inherit; font-size: .9rem; line-height: 1.45;
    padding: .2rem; border-radius: 6px;
    resize: none; overflow: hidden;
    min-height: 2.9em;
  }
  .note-card.collapsed .note-content {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .note-card .section-summary {
    font-size: .75rem; color: var(--text-muted);
    display: flex; flex-wrap: wrap; gap: .3rem;
  }
  .note-card .section-summary span {
    background: var(--surface-2); border-radius: 6px;
    padding: .1rem .4rem;
  }

  .note-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: .78rem; color: var(--text-muted);
    margin-top: auto; padding-top: .25rem; gap: .5rem;
    flex-wrap: wrap;
    min-width: 0; max-width: 100%; overflow: hidden;
  }
  .note-meta {
    display: inline-flex; align-items: center; gap: .35rem;
    min-width: 0; overflow: hidden; flex: 1 1 auto;
  }
  .note-meta > .note-date {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .note-block-badge {
    font-size: .65rem;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: .02rem .35rem;
    white-space: nowrap;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .note-actions {
    display: flex; gap: .25rem; align-items: center;
    min-width: 0; flex-wrap: nowrap; max-width: 100%;
  }
  .note-actions .icon-btn { width: 30px; height: 30px; font-size: .95rem; }
  .note-actions .icon-btn.pin-active { color: var(--pin); }
  .note-actions .icon-btn.del:hover { color: var(--danger); border-color: var(--danger); }

  .block-select {
    font-size: .75rem; padding: .25rem .4rem;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-2); color: var(--text);
    max-width: 120px; min-width: 0; flex: 0 1 auto;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #pinnedList .note-footer { flex-wrap: nowrap; gap: .25rem; overflow: hidden; }
  #pinnedList .note-meta { flex: 1 1 auto; min-width: 0; }
  #pinnedList .note-meta > .note-date { font-size: .62rem; }
  #pinnedList .note-block-badge { font-size: .58rem; max-width: 60px; padding: 0 .25rem; }
  #pinnedList .note-actions { flex: 0 0 auto; flex-wrap: nowrap; }
  #pinnedList .block-select { max-width: 70px; font-size: .62rem; padding: .15rem .25rem; }
  #pinnedList .note-actions .icon-btn { width: 22px; height: 22px; font-size: .75rem; }

  /* ---------- РАСШИРЕННЫЙ РЕЖИМ ---------- */
  body.is-expanded .sidebar { display: none; }
  body.is-expanded .main-wrap { width: 100%; }
  body.is-expanded header { position: static; box-shadow: none; }

  body.is-expanded main {
    max-width: none; width: 100%; margin: 0;
    padding: 0 1rem 1.5rem;
  }
  body.is-expanded .notes-grid { display: none; }
  body.is-expanded h2 { display: none; }
  body.is-expanded .block-section { display: none; }
  body.is-expanded #pinnedSection { display: none; }

  .expanded-note {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0 1.5rem 1.25rem;
    box-shadow: var(--shadow-hover);
    display: flex; flex-direction: column;
    width: 100%; max-width: none;
    min-height: calc(100vh - 40px);
    position: relative;
  }

  .expanded-top {
    position: sticky; top: 0; z-index: 6;
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    padding: .75rem 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    margin-bottom: .75rem;
    border-radius: 16px 16px 0 0;
  }
  .expanded-note .note-title {
    font-size: 1.45rem; font-weight: 700;
    flex: 1; min-width: 200px;
  }
  .expanded-tools {
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    padding: .5rem 0; border-bottom: 1px solid var(--border);
    margin-bottom: .75rem;
  }
  .expanded-tools input[type="text"] {
    flex: 1; min-width: 180px;
    padding: .4rem .7rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text); font-size: .88rem; outline: none;
  }
  .expanded-tools input[type="text"]:focus { border-color: var(--accent); }

  .matches-panel {
    margin-bottom: .75rem;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: var(--surface-2);
    padding: .5rem .6rem;
    max-height: 260px;
    overflow-y: auto;
  }
  .matches-panel-title {
    font-size: .85rem; font-weight: 600;
    color: var(--accent);
    margin-bottom: .35rem;
  }
  .match-item {
    padding: .4rem .5rem;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: .25rem;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .match-item:hover { border-color: var(--accent); }
  .match-section-title {
    font-size: .8rem; font-weight: 600;
    color: var(--text);
    margin-bottom: .15rem;
  }
  .match-snippet {
    font-size: .8rem; color: var(--text-muted);
    line-height: 1.4;
    word-break: break-word;
  }
  .match-snippet mark,
  .match-section-title mark {
    background: var(--mark); color: inherit;
    padding: 0 2px; border-radius: 3px;
  }

  .sections-list { display: flex; flex-direction: column; gap: .9rem; }
  .section-card {
    border: 1px solid var(--border); border-radius: 12px;
    padding: .9rem 1rem; background: var(--surface-2);
    display: flex; flex-direction: column; gap: .4rem;
    scroll-margin-top: 140px;
    transition: outline .2s;
  }
  .section-head { display: flex; gap: .4rem; align-items: center; }
  .section-head input.section-title {
    flex: 1; font-size: 1rem; font-weight: 600;
    padding: .35rem .5rem; border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: var(--text); outline: none;
  }
  .section-head input.section-title:focus { background: var(--surface); border-color: var(--border); }

  .section-card textarea.section-content {
    width: 100%;
    min-height: 3em;
    resize: none;
    overflow: hidden;
    padding: .5rem .6rem;
    border: 1px solid transparent; border-radius: 8px;
    background: var(--surface); color: var(--text);
    font-family: inherit; font-size: .93rem; line-height: 1.5; outline: none;
    field-sizing: content;
  }
  .section-card textarea.section-content:focus { border-color: var(--accent); }

  .section-actions { display: flex; gap: .25rem; }
  .section-actions .icon-btn { width: 30px; height: 30px; font-size: .9rem; }

  .section-links { margin-top: .15rem; }
  .section-links-toggle {
    display: inline-flex; align-items: center; gap: .3rem;
    background: transparent; border: 1px dashed var(--border);
    color: var(--text-muted); font-size: .8rem;
    padding: .25rem .55rem; border-radius: 6px; cursor: pointer;
  }
  .section-links-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .section-links-toggle.open { border-style: solid; border-color: var(--accent); color: var(--accent); }

  .section-links-list {
    display: none; margin-top: .35rem;
    padding: .35rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    max-height: 220px; overflow-y: auto;
  }
  .section-links-list.show { display: block; }
  .section-links-list a {
    display: block; padding: .3rem .45rem;
    border-radius: 6px; font-size: .82rem;
    color: var(--accent); text-decoration: none;
    word-break: break-all;
  }
  .section-links-list a:hover { background: var(--surface-2); text-decoration: underline; }
  .section-links-list .no-links {
    color: var(--text-muted); font-size: .8rem; font-style: italic;
    padding: .25rem .45rem;
  }

  .empty { color: var(--text-muted); font-style: italic; font-size: .9rem; padding: .5rem 0; }

  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(120%);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: .7rem 1.1rem; font-size: .9rem;
    box-shadow: var(--shadow-hover); z-index: 100;
    transition: transform .3s ease; opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .status-bar {
    position: fixed; top: .5rem; right: .5rem; z-index: 50;
    font-size: .75rem; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border);
    padding: .25rem .6rem; border-radius: 6px;
    display: none;
  }
  .status-bar.show { display: block; }

  mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }

  @media (max-width: 1100px) {
    #pinnedList { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    header {
      grid-template-columns: auto 1fr auto auto;
      grid-template-areas:
        "toggle logo search search"
        "token  token token token"
        "theme  theme theme new";
      row-gap: .5rem;
    }
    .token-wrap { grid-column: 1 / -1; }
    .token-wrap input { width: 100%; flex: 1; }
    #themeBtn { justify-self: start; }
    .new-wrap { justify-self: end; }
  }

  @media (max-width: 820px) {
    .app { flex-direction: column; }
    aside.sidebar {
      width: 100%; height: auto; position: sticky; top: 0;

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   КОНФИГУРАЦИЯ GITHUB
   ========================================================= */
const GITHUB_OWNER  = 'yaroslaveduardov696969-a11y';
const GITHUB_REPO   = 'lamoda-notes1';
const GITHUB_BRANCH = 'main';
const GITHUB_FILE_PATH = 'notes.json';

const GITHUB_API_URL =
  `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;

const THEME_KEY = 'lamoda_theme';
const TOKEN_KEY = 'lamoda_gh_token';
const SIDEBAR_KEY = 'lamoda_sidebar_collapsed';

const MAX_PINNED = 6;
const UNSORTED_ID = 'unsorted';

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let blocks = [{ id: UNSORTED_ID, name: 'Несортированные' }];
let notes = [];
let searchQuery = '';
let searchField = 'all';
let expandedId = null;
let expandedSectionQuery = '';
let saveInFlight = false;
const openLinksSections = new Set();

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function nowISO() { return new Date().toISOString(); }
function formatDate(iso) {
  try {
    return new Date(iso).toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch { return ''; }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function pinnedCount() { return notes.filter(n => n.pinned).length; }
function blockName(id) {
  return (blocks.find(b => b.id === id) || { name: 'Без блока' }).name;
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

let statusTimer = null;
function setStatus(msg) {
  const el = document.getElementById('statusBar');
  if (!el) return;
  if (!msg) { el.classList.remove('show'); return; }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

/* =========================================================
   ИЗВЛЕЧЕНИЕ ССЫЛОК
   ========================================================= */
function extractLinks(text) {
  if (!text) return [];
  const found = new Set();
  const mdRe = /\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/gi;
  let m;
  while ((m = mdRe.exec(text)) !== null) found.add(m[1]);
  const urlRe = /(https?:\/\/[^\s<>"')\]]+)/gi;
  while ((m = urlRe.exec(text)) !== null) {
    let url = m[1].replace(/[.,;:!?]+$/g, '');
    found.add(url);
  }
  return Array.from(found);
}

/* =========================================================
   АВТО-ВЫСОТА TEXTAREA
   ========================================================= */
function autoResizeTextarea(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function autoResizeAllSections() {
  document.querySelectorAll('.section-card textarea.section-content').forEach(autoResizeTextarea);
}

/* =========================================================
   ДИНАМИЧЕСКИЙ ОТСТУП
   ========================================================= */
function updateScrollOffset() {
  const headerEl = document.querySelector('header');
  const sidebarEl = document.getElementById('sidebar');
  let offset = (headerEl?.offsetHeight || 0) + 10;
  if (window.innerWidth <= 820 && sidebarEl && !document.body.classList.contains('sidebar-collapsed')) {
    offset += (sidebarEl.offsetHeight || 0);
  }
  document.documentElement.style.setProperty('--scroll-offset', offset + 'px');
}
updateScrollOffset();
window.addEventListener('resize', updateScrollOffset);

/* =========================================================
   ТОКЕН
   ========================================================= */
function getToken() { return (localStorage.getItem(TOKEN_KEY) || '').trim(); }
function setToken(t) {
  if (t && t.trim()) localStorage.setItem(TOKEN_KEY, t.trim());
  else localStorage.removeItem(TOKEN_KEY);
}

const tokenInput = document.getElementById('tokenInput');
const tokenSaveBtn = document.getElementById('tokenSaveBtn');
const tokenClearBtn = document.getElementById('tokenClearBtn');

if (tokenInput) tokenInput.value = getToken();

if (tokenSaveBtn) {
  tokenSaveBtn.addEventListener('click', async () => {
    const t = (tokenInput.value || '').trim();
    if (!t) { showToast('Введите токен'); return; }
    setToken(t);
    setStatus('Токен сохранён');
    const loaded = await loadFromGitHub();
    if (loaded !== null) { applyData(loaded); render(); }
  });
}
if (tokenClearBtn) {
  tokenClearBtn.addEventListener('click', () => {
    setToken('');
    if (tokenInput) tokenInput.value = '';
    showToast('Токен удалён');
    setStatus('Токен удалён');
  });
}

/* =========================================================
   СВОРАЧИВАНИЕ САЙДБАРА
   ========================================================= */
const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');

function applySidebarState(collapsed) {
  if (collapsed) document.body.classList.add('sidebar-collapsed');
  else document.body.classList.remove('sidebar-collapsed');
  localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0');
  setTimeout(updateScrollOffset, 220);
}
applySidebarState(localStorage.getItem(SIDEBAR_KEY) === '1');
if (sidebarToggleBtn) {
  sidebarToggleBtn.addEventListener('click', () => {
    applySidebarState(!document.body.classList.contains('sidebar-collapsed'));
  });
}

/* =========================================================
   GITHUB API
   ========================================================= */
async function loadFromGitHub() {
  const token = getToken();
  if (!token) { setStatus('Токен не указан'); return null; }
  setStatus('Загрузка...');
  try {
    const res = await fetch(GITHUB_API_URL, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
      cache: 'no-store',
    });
    if (res.status === 404) { setStatus('notes.json не найден — будет создан'); return { blocks: [{id:UNSORTED_ID,name:'Несортированные'}], notes: [] }; }
    if (res.status === 401) { setStatus('Токен не принят (401)'); showToast('Токен неверный или отозван'); return null; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const raw = atob(data.content.replace(/\s/g, ''));
    const json = decodeURIComponent(escape(raw));
    const parsed = JSON.parse(json || 'null');
    setStatus('Загружено');
    return parsed;
  } catch (e) {
    console.error('loadFromGitHub:', e);
    setStatus('Ошибка загрузки');
    showToast('Не удалось загрузить');
    return null;
  }
}

async function saveToGitHub() {
  const token = getToken();
  if (!token) { setStatus('Токен не указан — только локально'); return; }
  if (saveInFlight) { saveToGitHub._again = true; return; }
  saveInFlight = true;
  setStatus('Сохранение...');
  try {
    let sha = null;
    const getRes = await fetch(GITHUB_API_URL, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' },
      cache: 'no-store',
    });
    if (getRes.ok) { const cur = await getRes.json(); sha = cur.sha; }
    else if (getRes.status === 401) throw new Error('401');
    else if (getRes.status !== 404) throw new Error(`GET SHA: ${getRes.status}`);

    const payload = { blocks, notes };
    const json = JSON.stringify(payload, null, 2);
    const base64 = btoa(unescape(encodeURIComponent(json)));

    const body = {
      message: `Обновление (${new Date().toLocaleString('ru-RU')})`,
      content: base64, branch: GITHUB_BRANCH,
    };
    if (sha) body.sha = sha;

    const putRes = await fetch(GITHUB_API_URL, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });
    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      if (putRes.status === 401) throw new Error('401');
      throw new Error(`PUT: ${putRes.status} ${err.message || ''}`);
    }
    setStatus('Сохранено в GitHub ✓');
  } catch (e) {
    console.error('saveToGitHub:', e);
    setStatus('Ошибка сохранения');
    showToast('Не удалось сохранить');
  } finally {
    saveInFlight = false;
    if (saveToGitHub._again) { saveToGitHub._again = false; saveToGitHub(); }
  }
}

/* =========================================================
   МИГРАЦИЯ
   ========================================================= */
function applyData(data) {
  if (!data) return;
  if (Array.isArray(data)) {
    blocks = [{ id: UNSORTED_ID, name: 'Несортированные' }];
    notes = data.map(migrateOldNote);
    return;
  }
  if (Array.isArray(data.blocks)) {
    blocks = data.blocks.slice();
    if (!blocks.some(b => b.id === UNSORTED_ID)) blocks.unshift({ id: UNSORTED_ID, name: 'Несортированные' });
  } else {
    blocks = [{ id: UNSORTED_ID, name: 'Несортированные' }];
  }
  notes = Array.isArray(data.notes) ? data.notes.map(migrateOldNote) : [];
}
function migrateOldNote(n) {
  if (Array.isArray(n.sections)) {
    return {
      id: n.id || uid(), title: n.title || '',
      block: n.block || UNSORTED_ID, pinned: !!n.pinned,
      updatedAt: n.updatedAt || nowISO(),
      sections: n.sections.map(s => ({ id: s.id || uid(), title: s.title || '', content: s.content || '' })),
    };
  }
  return {
    id: n.id || uid(), title: n.title || '',
    block: n.block || UNSORTED_ID, pinned: !!n.pinned,
    updatedAt: n.updatedAt || nowISO(),
    sections: [{ id: uid(), title: 'Основное', content: n.content || '' }],
  };
}

/* =========================================================
   ДИАГНОСТИКА
   ========================================================= */
['searchInput','searchField','newBtn','pinnedList','toast','themeBtn','statusBar','tokenInput','tokenSaveBtn','tokenClearBtn','blocksContainer','expandedHost','pinnedSection','sidebar','blocksList','addBlockBtn','newMenu','sidebarToggleBtn','searchClearBtn']
  .forEach(id => { if (!document.getElementById(id)) console.warn('Нет #' + id); });

/* =========================================================
   САЙДБАР
   ========================================================= */
const blocksListEl = document.getElementById('blocksList');
const addBlockBtn = document.getElementById('addBlockBtn');

function renderSidebar() {
  if (!blocksListEl) return;
  blocksListEl.innerHTML = blocks.map(b => {
    const count = notes.filter(n => n.block === b.id).length;
    const isUnsorted = b.id === UNSORTED_ID;
    return `
      <li>
        <div class="block-row">
          <button class="block-link" data-block="${b.id}">
            <span class="block-name">${escapeHtml(b.name)}</span>
            <span class="count">${count}</span>
          </button>
          <button class="block-btn" data-rename-block="${b.id}" title="Переименовать блок">✎</button>
          ${isUnsorted ? '' : `<button class="block-btn del-block" data-del-block="${b.id}" title="Удалить блок">✕</button>`}
        </div>
      </li>
    `;
  }).join('');

  blocksListEl.querySelectorAll('.block-link').forEach(btn => {
    btn.addEventListener('click', e => {
      if (e.target.closest('[data-del-block]') || e.target.closest('[data-rename-block]')) return;
      const blockId = btn.dataset.block;
      if (expandedId) { expandedId = null; render(); }
      setTimeout(() => {
        const section = document.getElementById('block-' + blockId);
        if (!section) return;
        const heading = section.querySelector('h2');
        const target = heading || section;
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 30);
    });
  });

  blocksListEl.querySelectorAll('[data-rename-block]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.renameBlock;
      const block = blocks.find(b => b.id === id);
      if (!block) return;
      const name = prompt('Новое название блока:', block.name);
      if (name === null) return;
      const trimmed = name.trim();
      if (!trimmed) { showToast('Название не может быть пустым'); return; }
      block.name = trimmed;
      saveToGitHub();
      render();
      showToast('Блок переименован');
    });
  });

  blocksListEl.querySelectorAll('[data-del-block]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.delBlock;
      if (id === UNSORTED_ID) return;
      if (!confirm('Удалить блок? Заметки из него перейдут в «Несортированные».')) return;
      blocks = blocks.filter(b => b.id !== id);
      notes = notes.map(n => n.block === id ? { ...n, block: UNSORTED_ID } : n);
      saveToGitHub();
      render();
    });
  });
}

if (addBlockBtn) {
  addBlockBtn.addEventListener('click', () => {
    const name = prompt('Название нового блока:');
    if (!name || !name.trim()) return;
    const id = 'b_' + uid();
    blocks.push({ id, name: name.trim() });
    saveToGitHub();
    render();
    showToast('Блок создан');
  });
}

/* =========================================================
   РЕНДЕР
   ========================================================= */
const pinnedList = document.getElementById('pinnedList');
const blocksContainer = document.getElementById('blocksContainer');
const expandedHost = document.getElementById('expandedHost');
const pinnedSection = document.getElementById('pinnedSection');
const body = document.body;

function matches(note) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  const inTitle = (note.title || '').toLowerCase().includes(q);
  const inSections = (note.sections || []).some(s =>
    (s.title || '').toLowerCase().includes(q) ||
    (s.content || '').toLowerCase().includes(q)
  );
  if (searchField === 'title') return inTitle;
  if (searchField === 'content') return inSections;
  return inTitle || inSections;
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const safe = escapeHtml(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

function makeSnippet(text, query) {
  if (!text) return '';
  const q = query.toLowerCase();
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return highlight(text.slice(0, 200), query);
  const start = Math.max(0, idx - 60);
  const end = Math.min(text.length, idx + q.length + 60);
  let snippet = (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
  return highlight(snippet, query);
}

function firstSectionPreview(note) {
  const s = (note.sections || [])[0];
  return s ? s.content : '';
}

function noteCardHTML(note) {
  const q = searchQuery;
  const titleHTML = q ? highlight(note.title || '', q) : escapeHtml(note.title || '');
  const preview = q
    ? highlight(firstSectionPreview(note), q)
    : escapeHtml(firstSectionPreview(note));
  const sectionsCount = (note.sections || []).length;
  const bName = blockName(note.block);

  return `
    <article class="note-card collapsed" data-id="${note.id}">
      <div class="note-title">${titleHTML || '<span style="color:var(--text-muted)">Без названия</span>'}</div>
      <div class="note-content">${preview || '<span style="color:var(--text-muted)">Пусто</span>'}</div>
      ${sectionsCount > 1 ? `<div class="section-summary">${(note.sections || []).slice(0,3).map(s => `<span>${escapeHtml(s.title || 'Без названия')}</span>`).join('')}${sectionsCount > 3 ? `<span>+${sectionsCount-3}</span>` : ''}</div>` : ''}
      <div class="note-footer">
        <span class="note-meta">
          <span class="note-date">${formatDate(note.updatedAt)}</span>
          <span class="note-block-badge" title="Блок: ${escapeHtml(bName)}">${escapeHtml(bName)}</span>
        </span>
        <div class="note-actions">
          <select class="block-select" data-block-select="${note.id}" title="Переместить в блок">
            ${blocks.map(b => `<option value="${b.id}" ${b.id === note.block ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
          </select>
          <button class="icon-btn ${note.pinned ? 'pin-active' : ''}" data-action="pin" data-id="${note.id}" title="${note.pinned ? 'Открепить' : 'Закрепить'}">📌</button>
          <button class="icon-btn del" data-action="delete" data-id="${note.id}" title="Удалить">🗑</button>
        </div>
      </div>
    </article>
  `;
}

function render() {
  if (!pinnedList || !blocksContainer || !expandedHost) return;

  if (expandedId) {
    const note = notes.find(n => n.id === expandedId);
    if (!note) { expandedId = null; }
    else {
      body.classList.add('is-expanded');
      pinnedSection.style.display = 'none';
      blocksContainer.style.display = 'none';
      expandedHost.innerHTML = expandedNoteHTML(note);
      bindExpandedEvents(note);
      setTimeout(autoResizeAllSections, 0);
      requestAnimationFrame(() => { window.scrollTo({ top: 0, behavior: 'auto' }); });
      return;
    }
  }

  body.classList.remove('is-expanded');
  pinnedSection.style.display = '';
  blocksContainer.style.display = '';
  expandedHost.innerHTML = '';

  const filtered = notes.filter(matches);

  const pinned = filtered.filter(n => n.pinned).slice(0, MAX_PINNED);
  pinnedList.innerHTML = pinned.length
    ? pinned.map(noteCardHTML).join('')
    : '<p class="empty">Нет закреплённых заметок</p>';

  if (searchQuery) {
    const others = filtered.filter(n => !n.pinned);
    blocksContainer.innerHTML = `
      <section class="block-section search-results">
        <h2>🔍 Результаты поиска (${filtered.length})</h2>
        <div class="notes-grid">
          ${others.length ? others.map(noteCardHTML).join('') : '<p class="empty">Ничего не найдено</p>'}
        </div>
      </section>
    `;
  } else {
    blocksContainer.innerHTML = blocks.map(b => {
      const blockNotes = filtered.filter(n => n.block === b.id && !n.pinned);
      return `
        <section class="block-section" id="block-${b.id}" data-block-section="${b.id}">
          <h2>${escapeHtml(b.name)} <span style="font-weight:400; text-transform:none; letter-spacing:0;">(${blockNotes.length})</span></h2>
          <div class="notes-grid" data-block-grid="${b.id}">
            ${blockNotes.length
              ? blockNotes.map(noteCardHTML).join('')
              : '<p class="empty">В этом блоке пока нет заметок</p>'}
          </div>
        </section>
      `;
    }).join('');
  }

  bindGridEvents();
  renderSidebar();
}

/* =========================================================
   РАСШИРЕННАЯ ЗАМЕТКА
   ========================================================= */
function renderMatchesPanel(note) {
  if (!searchQuery) return '';
  const q = searchQuery.toLowerCase();
  const items = [];

  if ((note.title || '').toLowerCase().includes(q)) {
    items.push(`<div class="match-item" data-scroll-to="note-title">
      <div class="match-section-title">Название заметки</div>
      <div class="match-snippet">${highlight(note.title, searchQuery)}</div>
    </div>`);
  }

  (note.sections || []).forEach(s => {
    const inTitle = (s.title || '').toLowerCase().includes(q);
    const inContent = (s.content || '').toLowerCase().includes(q);
    if (!inTitle && !inContent) return;
    const snippet = makeSnippet(s.content || '', searchQuery);
    items.push(`<div class="match-item" data-scroll-to-section="${s.id}">
      <div class="match-section-title">Раздел: ${highlight(s.title || 'Без названия', searchQuery)}</div>
      <div class="match-snippet">${snippet}</div>
    </div>`);
  });

  if (!items.length) return '';
  return `<div class="matches-panel">
    <div class="matches-panel-title">🔍 Совпадения в этой заметке (${items.length})</div>
    ${items.join('')}
  </div>`;
}

function expandedNoteHTML(note) {
  const q = expandedSectionQuery.toLowerCase();
  const sections = (note.sections || []).filter(s => {
    if (!q) return true;
    return (s.title || '').toLowerCase().includes(q) ||
           (s.content || '').toLowerCase().includes(q);
  });

  const matchesPanel = renderMatchesPanel(note);

  return `
    <div class="expanded-note" data-id="${note.id}">
      <div class="expanded-top">
        <button class="icon-btn" data-action="collapse" title="Назад (Esc)">←</button>
        <input class="note-title" data-field="note-title" value="${escapeHtml(note.title || '')}" placeholder="Название заметки..." />
        <select class="block-select" data-block-select="${note.id}" title="Блок">
          ${blocks.map(b => `<option value="${b.id}" ${b.id === note.block ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
        </select>
        <button class="icon-btn ${note.pinned ? 'pin-active' : ''}" data-action="pin" title="${note.pinned ? 'Открепить' : 'Закрепить'}">📌</button>
      </div>

      <div class="expanded-tools">
        <input type="text" id="sectionSearchInput" placeholder="Поиск по разделам этой заметки..." value="${escapeHtml(expandedSectionQuery)}" />
        <button class="btn small" data-action="add-section">+ Раздел</button>
      </div>

      ${matchesPanel}

      <div class="sections-list">
        ${sections.length ? sections.map(sectionCardHTML).join('') : '<p class="empty">Разделов нет. Нажмите «+ Раздел».</p>'}
      </div>
    </div>
  `;
}

function sectionCardHTML(s) {
  const links = extractLinks(s.content || '');
  const isOpen = openLinksSections.has(s.id);
  const linksHtml = links.length
    ? `<div class="section-links-list ${isOpen ? 'show' : ''}">
         ${links.map(u => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(u)}</a>`).join('')}
       </div>`
    : `<div class="section-links-list ${isOpen ? 'show' : ''}">
         <div class="no-links">В этом разделе нет ссылок</div>
       </div>`;

  return `
    <div class="section-card" data-section-id="${s.id}">
      <div class="section-head">
        <input class="section-title" data-field="section-title" value="${escapeHtml(s.title || '')}" placeholder="Название раздела..." />
        <div class="section-actions">
          <button class="icon-btn" data-action="copy-section" title="Копировать текст раздела">📋</button>
          <button class="icon-btn del" data-action="delete-section" title="Удалить раздел">🗑</button>
        </div>
      </div>
      <textarea class="section-content" data-field="section-content" placeholder="Текст раздела...">${escapeHtml(s.content || '')}</textarea>

      <div class="section-links">
        <button class="section-links-toggle ${isOpen ? 'open' : ''}" data-action="toggle-links" data-section-id="${s.id}">
          🔗 Ссылки в разделе (${links.length})
        </button>
        ${linksHtml}
      </div>
    </div>
  `;
}

/* =========================================================
   СОБЫТИЯ: сетка
   ========================================================= */
function bindGridEvents() {
  document.querySelectorAll('.note-card.collapsed').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('[data-action]') || e.target.closest('[data-block-select]')) return;
      expandedId = card.dataset.id;
      expandedSectionQuery = '';
      render();
    });
  });

  document.querySelectorAll('.note-card.collapsed [data-action="pin"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      togglePin(btn.dataset.id);
    });
  });

  document.querySelectorAll('.note-card.collapsed [data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteNote(btn.dataset.id);
    });
  });

  document.querySelectorAll('[data-block-select]').forEach(sel => {
    sel.addEventListener('change', () => {
      const noteId = sel.dataset.blockSelect;
      const note = notes.find(n => n.id === noteId);
      if (!note) return;
      note.block = sel.value;
      note.updatedAt = nowISO();
      saveToGitHub();
      render();
      showToast('Заметка перемещена в «' + blockName(note.block) + '»');
    });
  });
}

/* =========================================================
   СОБЫТИЯ: расширенная заметка
   ========================================================= */
function bindExpandedEvents(note) {
  const root = expandedHost.querySelector('.expanded-note');
  if (!root) return;

  root.querySelector('[data-action="collapse"]').addEventListener('click', () => {
    expandedId = null;
    expandedSectionQuery = '';
    render();
  });

  const titleInput = root.querySelector('[data-field="note-title"]');
  let titleTimer = null;
  titleInput.addEventListener('input', () => {
    clearTimeout(titleTimer);
    titleTimer = setTimeout(() => {
      note.title = titleInput.value;
      note.updatedAt = nowISO();
      saveToGitHub();
    }, 500);
  });

  const searchEl = root.querySelector('#sectionSearchInput');
  searchEl.addEventListener('input', () => {
    expandedSectionQuery = searchEl.value.trim();
    const list = root.querySelector('.sections-list');
    const q = expandedSectionQuery.toLowerCase();
    const filtered = (note.sections || []).filter(s => {
      if (!q) return true;
      return (s.title || '').toLowerCase().includes(q) ||
             (s.content || '').toLowerCase().includes(q);
    });
    list.innerHTML = filtered.length
      ? filtered.map(sectionCardHTML).join('')
      : '<p class="empty">Ничего не найдено</p>';
    bindSectionEvents(note, root);
    setTimeout(autoResizeAllSections, 0);
  });

  root.querySelector('[data-action="add-section"]').addEventListener('click', () => {
    note.sections = note.sections || [];
    note.sections.push({ id: uid(), title: '', content: '' });
    note.updatedAt = nowISO();
    saveToGitHub();
    render();
  });

  const blockSel = root.querySelector('[data-block-select]');
  if (blockSel) {
    blockSel.addEventListener('change', () => {
      const newBlock = blockSel.value;
      note.block = newBlock;
      note.updatedAt = nowISO();
      saveToGitHub();
      showToast('Заметка перемещена в «' + blockName(newBlock) + '»');
      expandedId = null;
      expandedSectionQuery = '';
      render();
    });
  }

  const pinBtn = root.querySelector('[data-action="pin"]');
  if (pinBtn) {
    pinBtn.addEventListener('click', () => { togglePin(note.id); });
  }

  root.querySelectorAll('.match-item').forEach(item => {
    item.addEventListener('click', () => {
      const sid = item.dataset.scrollToSection;
      if (sid) {
        const card = root.querySelector(`.section-card[data-section-id="${sid}"]`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          card.style.outline = '2px solid var(--accent)';
          setTimeout(() => { card.style.outline = ''; }, 1500);
        }
      } else if (item.dataset.scrollTo === 'note-title') {
        const ti = root.querySelector('[data-field="note-title"]');
        if (ti) { ti.scrollIntoView({ behavior: 'smooth', block: 'center' }); ti.focus(); }
      }
    });
  });

  bindSectionEvents(note, root);
}

function bindSectionEvents(note, root) {
  root.querySelectorAll('.section-card').forEach(card => {
    const sid = card.dataset.sectionId;
    const section = (note.sections || []).find(s => s.id === sid);
    if (!section) return;

    const titleEl = card.querySelector('[data-field="section-title"]');
    const contentEl = card.querySelector('[data-field="section-content"]');

    autoResizeTextarea(contentEl);

    function updateLinksBlock() {
      const links = extractLinks(section.content || '');
      const toggle = card.querySelector('[data-action="toggle-links"]');
      const listEl = card.querySelector('.section-links-list');
      if (toggle) {
        toggle.textContent = `🔗 Ссылки в разделе (${links.length})`;
        toggle.classList.toggle('open', openLinksSections.has(sid));
      }
      if (listEl) {
        if (links.length) {
          listEl.innerHTML = links.map(u =>
            `<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(u)}</a>`
          ).join('');
        } else {
          listEl.innerHTML = `<div class="no-links">В этом разделе нет ссылок</div>`;
        }
        listEl.classList.toggle('show', openLinksSections.has(sid));
      }
    }
    updateLinksBlock();

    let t1 = null, t2 = null;
    titleEl.addEventListener('input', () => {
      clearTimeout(t1);
      t1 = setTimeout(() => {
        section.title = titleEl.value;
        note.updatedAt = nowISO();
        saveToGitHub();
      }, 500);
    });
    contentEl.addEventListener('input', () => {
      autoResizeTextarea(contentEl);
      updateLinksBlock();
      clearTimeout(t2);
      t2 = setTimeout(() => {
        section.content = contentEl.value;
        note.updatedAt = nowISO();
        saveToGitHub();
      }, 500);
    });

    const toggleBtn = card.querySelector('[data-action="toggle-links"]');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const listEl = card.querySelector('.section-links-list');
        if (openLinksSections.has(sid)) {
          openLinksSections.delete(sid);
          listEl.classList.remove('show');
          toggleBtn.classList.remove('open');
        } else {
          openLinksSections.add(sid);
          listEl.classList.add('show');
          toggleBtn.classList.add('open');
        }
      });
    }

    card.querySelector('[data-action="copy-section"]').addEventListener('click', async (e) => {
      e.stopPropagation();
      const text = section.content || '';
      try {
        await navigator.clipboard.writeText(text);
        showToast('Текст раздела скопирован');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('Текст раздела скопирован'); }
        catch { showToast('Не удалось скопировать'); }
        document.body.removeChild(ta);
      }
    });

    card.querySelector('[data-action="delete-section"]').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('Удалить раздел?')) return;
      openLinksSections.delete(sid);
      note.sections = (note.sections || []).filter(s => s.id !== sid);
      note.updatedAt = nowISO();
      saveToGitHub();
      render();
    });
  });
}

/* =========================================================
   ДЕЙСТВИЯ
   ========================================================= */
function togglePin(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  if (!note.pinned && pinnedCount() >= MAX_PINNED) {
    showToast(`Можно закрепить не более ${MAX_PINNED} заметок`);
    return;
  }
  note.pinned = !note.pinned;
  note.updatedAt = nowISO();
  saveToGitHub();
  render();
  showToast(note.pinned ? 'Заметка закреплена' : 'Заметка откреплена');
}

function deleteNote(id) {
  if (!confirm('Удалить заметку?')) return;
  notes = notes.filter(n => n.id !== id);
  if (expandedId === id) expandedId = null;
  saveToGitHub();
  render();
  showToast('Заметка удалена');
}

/* =========================================================
   ПОИСК В ШАПКЕ + КРЕСТИК ОЧИСТКИ
   ========================================================= */
const searchInputEl = document.getElementById('searchInput');
const searchClearBtn = document.getElementById('searchClearBtn');

function updateClearBtn() {
  if (!searchClearBtn || !searchInputEl) return;
  if (searchInputEl.value.length > 0) searchClearBtn.classList.add('show');
  else searchClearBtn.classList.remove('show');
}
updateClearBtn();

if (searchInputEl) {
  searchInputEl.addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    updateClearBtn();
    if (expandedId) expandedId = null;
    render();
  });
}
if (searchClearBtn) {
  searchClearBtn.addEventListener('click', () => {
    if (!searchInputEl) return;
    searchInputEl.value = '';
    searchQuery = '';
    updateClearBtn();
    searchInputEl.focus();
    if (expandedId) expandedId = null;
    render();
  });
}
const searchFieldEl = document.getElementById('searchField');
if (searchFieldEl) {
  searchFieldEl.addEventListener('change', e => {
    searchField = e.target.value;
    if (expandedId) expandedId = null;
    render();
  });
}

/* =========================================================
   МЕНЮ «+ НОВАЯ»
   ========================================================= */
const newBtnEl = document.getElementById('newBtn');
const newMenuEl = document.getElementById('newMenu');

if (newBtnEl && newMenuEl) {
  newBtnEl.addEventListener('click', (e) => {
    e.stopPropagation();
    newMenuEl.classList.toggle('show');
  });
  document.addEventListener('click', () => newMenuEl.classList.remove('show'));

  newMenuEl.querySelectorAll('[data-new]').forEach(btn => {
    btn.addEventListener('click', () => {
      newMenuEl.classList.remove('show');
      const kind = btn.dataset.new;
      if (kind === 'note') createNote();
      else if (kind === 'section') createSectionInOpenNote();
      else if (kind === 'block') document.getElementById('addBlockBtn')?.click();
    });
  });
}

function createNote() {
  const note = {
    id: uid(), title: '', block: UNSORTED_ID, pinned: false,
    updatedAt: nowISO(),
    sections: [{ id: uid(), title: 'Основное', content: '' }],
  };
  notes.unshift(note);
  expandedId = note.id;
  expandedSectionQuery = '';
  render();
  const titleInput = expandedHost.querySelector('[data-field="note-title"]');
  if (titleInput) titleInput.focus();
  saveToGitHub();
}

function createSectionInOpenNote() {
  if (!expandedId) { showToast('Сначала откройте заметку'); return; }
  const note = notes.find(n => n.id === expandedId);
  if (!note) return;
  note.sections = note.sections || [];
  note.sections.push({ id: uid(), title: '', content: '' });
  note.updatedAt = nowISO();
  saveToGitHub();
  render();
  const cards = expandedHost.querySelectorAll('.section-card');
  const last = cards[cards.length - 1];
  if (last) last.querySelector('[data-field="section-title"]').focus();
}

/* =========================================================
   ТЕМА
   ========================================================= */
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
function applyTheme(theme) {
  html.dataset.theme = theme;
  if (themeBtn) themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  localStorage.setItem(THEME_KEY, theme);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'light');
if (themeBtn) {
  themeBtn.addEventListener('click', () => {
    applyTheme(html.dataset.theme === 'light' ? 'dark' : 'light');
  });
}

/* =========================================================
   ESC
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && expandedId) {
    expandedId = null;
    expandedSectionQuery = '';
    render();
  }
});

/* =========================================================
   СТАРТ
   ========================================================= */
(async function init() {
  const data = await loadFromGitHub();
  if (data !== null) {
    applyData(data);
  } else {
    blocks = [{ id: UNSORTED_ID, name: 'Несортированные' }];
    notes = [{
      id: uid(), title: 'Добро пожаловать в Ламоду',
      block: UNSORTED_ID, pinned: true, updatedAt: nowISO(),
      sections: [
        { id: uid(), title: 'О сайте', content: 'Кликните по заметке, чтобы открыть её. При поиске результаты показываются плоским списком, с бейджем блока на каждой карточке. Крестик в поле поиска очищает запрос.' },
        { id: uid(), title: 'Блоки', content: 'Блоки — это категории заметок. Название блока можно переименовать (кнопка ✎). Заметку можно переместить в блок через выпадающий список в карточке.' },
      ],
    }];
  }
  render();
  updateScrollOffset();
})();
</script>
