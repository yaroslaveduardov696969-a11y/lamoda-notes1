<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ламода</title>
<style>
  :root,
  [data-theme="light"] {
    --bg: #eaf2fb;
    --surface: #ffffff;
    --surface-2: #dce9f7;
    --text: #132a44;
    --text-muted: #5a7a9e;
    --border: #c5d8ee;
    --accent: #1a73e8;
    --accent-hover: #1558b8;
    --pin: #ffb700;
    --danger: #d93025;
    --mark: #ffe58f;
    --shadow: 0 1px 3px rgba(19, 42, 68, .1);
    --shadow-hover: 0 4px 14px rgba(19, 42, 68, .16);
    --star-opacity: .2;
  }
  [data-theme="dark"] {
    --bg: #0b0b1a;
    --surface: #1c1c2e;
    --surface-2: #262640;
    --text: #f5f5f7;
    --text-muted: #9898b0;
    --border: #2e2e4a;
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --pin: #ffd60a;
    --danger: #ff453a;
    --mark: #6b5a00;
    --shadow: 0 1px 3px rgba(0,0,0,.5);
    --shadow-hover: 0 4px 14px rgba(0,0,0,.7);
    --star-opacity: 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .stars, .stars2, .stars3 {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--star-opacity); transition: opacity .3s;
  }
  .stars {
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 160px 120px, #fff, transparent),
      radial-gradient(1px 1px at 230px 80px, #fff, transparent),
      radial-gradient(1px 1px at 300px 160px, #fff, transparent),
      radial-gradient(1px 1px at 380px 60px, #fff, transparent),
      radial-gradient(1px 1px at 450px 140px, #fff, transparent),
      radial-gradient(1px 1px at 520px 20px, #fff, transparent),
      radial-gradient(1px 1px at 600px 180px, #fff, transparent);
    background-repeat: repeat; background-size: 650px 200px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars2 {
    background-image:
      radial-gradient(1.5px 1.5px at 50px 50px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 200px 130px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 350px 70px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 500px 170px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 650px 30px, #cfe8ff, transparent);
    background-repeat: repeat; background-size: 750px 220px;
    animation: twinkle 6s ease-in-out infinite alternate-reverse;
  }
  .stars3 {
    background-image:
      radial-gradient(2px 2px at 120px 90px, #ffffff, transparent),
      radial-gradient(2px 2px at 420px 150px, #ffffff, transparent),
      radial-gradient(2px 2px at 700px 40px, #ffffff, transparent);
    background-repeat: repeat; background-size: 900px 260px;
    animation: twinkle 8s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: calc(var(--star-opacity) * .6); }
    100% { opacity: var(--star-opacity); }
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.5rem;
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    box-shadow: var(--shadow);
  }
  .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; margin-right: .25rem; }
  .search-wrap { display: flex; gap: .5rem; flex: 1; min-width: 240px; }
  .search-wrap input {
    flex: 1; padding: .5rem .75rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text);
    font-size: .95rem; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap select {
    padding: .5rem .6rem; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font-size: .9rem; cursor: pointer;
  }
  .token-wrap { display: flex; gap: .25rem; align-items: center; }
  .token-wrap input {
    width: 150px; padding: .4rem .6rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text);
    font-size: .82rem; outline: none;
  }
  .token-wrap input:focus { border-color: var(--accent); }
  .btn {
    padding: .5rem .9rem; border-radius: 8px; border: none;
    background: var(--accent); color: #fff;
    font-size: .9rem; font-weight: 500; cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.small { padding: .35rem .6rem; font-size: .8rem; }
  .btn.ghost {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.ghost:hover { background: var(--border); }
  .icon-btn {
    width: 36px; height: 36px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.1rem; border-radius: 8px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--border); }

  main { position: relative; z-index: 1; padding: 1.25rem 1.5rem 3rem; max-width: 1280px; margin: 0 auto; }
  h2 {
    font-size: .95rem; font-weight: 600; color: var(--text-muted);
    margin: 1.25rem 0 .75rem; text-transform: uppercase; letter-spacing: .04em;
  }
  h2:first-child { margin-top: 0; }

  /* ---------- Сетка всех заметок ---------- */
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  /* ---------- Сетка закреплённых: 6 в ряд, компактные ---------- */
  #pinnedList {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: .65rem;
  }
  #pinnedList .note-card {
    padding: .6rem .7rem;
    border-radius: 10px;
    gap: .3rem;
  }
  #pinnedList .note-title {
    font-size: .88rem;
    font-weight: 600;
    padding: .15rem;
  }
  #pinnedList .note-content {
    font-size: .78rem;
    line-height: 1.35;
    min-height: 2.5em;
    padding: .15rem;
  }
  #pinnedList .note-footer {
    font-size: .68rem;
    padding-top: .15rem;
  }
  #pinnedList .note-actions .icon-btn {
    width: 24px; height: 24px; font-size: .8rem;
  }

  /* ---------- Блок «Все заметки» сдвинут вниз ---------- */
  #allSection {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  #allSection h2 {
    margin-top: 0;
  }

  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    display: flex; flex-direction: column; gap: .5rem;
    box-shadow: var(--shadow);
    transition: box-shadow .2s, border-color .2s;
    position: relative;
  }
  .note-card:hover { box-shadow: var(--shadow-hover); }

  .note-title {
    font-weight: 600; font-size: 1.05rem;
    border: none; outline: none; background: transparent;
    color: var(--text); width: 100%; padding: .2rem;
    border-radius: 6px;
  }
  .note-title:focus { background: var(--surface-2); }

  .note-content {
    border: none; outline: none; background: transparent;
    color: var(--text); width: 100%;
    font-family: inherit; font-size: .93rem; line-height: 1.45;
    padding: .2rem; border-radius: 6px;
    resize: none; overflow: hidden;
    min-height: 2.9em;
  }
  .note-content:focus { background: var(--surface-2); }

  .note-card.collapsed .note-content {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
  }

  /* ---------- РАСШИРЕННЫЙ РЕЖИМ ---------- */
  body.is-expanded main {
    max-width: 100%;
    padding: 1.5rem 2rem 3rem;
  }
  body.is-expanded .notes-grid { display: none; }
  body.is-expanded h2 { display: none; }
  body.is-expanded #allSection { margin-top: 0; padding-top: 0; border-top: none; }
  body.is-expanded .note-card.expanded {
    display: flex;
    width: 100%;
    min-height: calc(100vh - 160px);
    border-radius: 16px;
    padding: 1.5rem 1.75rem;
    box-shadow: var(--shadow-hover);
  }
  body.is-expanded .note-card.expanded .note-title {
    font-size: 1.6rem;
    font-weight: 700;
    padding: .4rem .5rem;
  }
  body.is-expanded .note-card.expanded .note-content {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
    flex: 1;
    font-size: 1rem;
    line-height: 1.6;
    min-height: 40vh;
    padding: .5rem;
  }
  body.is-expanded .note-card.expanded .note-footer {
    font-size: .85rem;
    padding-top: .5rem;
    border-top: 1px solid var(--border);
    margin-top: .5rem;
  }

  .expand-back {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    align-self: flex-start;
    padding: .35rem .7rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: .85rem;
    cursor: pointer;
    margin-bottom: .25rem;
  }
  .expand-back:hover { background: var(--border); }

  .note-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: .78rem; color: var(--text-muted);
    margin-top: auto; padding-top: .25rem; gap: .5rem;
  }
  .note-actions { display: flex; gap: .25rem; }
  .note-actions .icon-btn { width: 30px; height: 30px; font-size: .95rem; }
  .note-actions .icon-btn.pin-active { color: var(--pin); }
  .note-actions .icon-btn.del:hover { color: var(--danger); border-color: var(--danger); }

  mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
  .empty { color: var(--text-muted); font-style: italic; font-size: .9rem; padding: .5rem 0; }

  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(120%);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: .7rem 1.1rem; font-size: .9rem;
    box-shadow: var(--shadow-hover); z-index: 100;
    transition: transform .3s ease; opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .status-bar {
    position: fixed; top: .5rem; right: .5rem; z-index: 50;
    font-size: .75rem; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border);
    padding: .25rem .6rem; border-radius: 6px;
    display: none;
  }
  .status-bar.show { display: block; }

  /* ---------- Адаптив ---------- */
  @media (max-width: 1100px) {
    #pinnedList { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    header { padding: .6rem 1rem; }
    .search-wrap { order: 3; flex-basis: 100%; }
    .token-wrap { order: 2; flex-basis: 100%; }
    .token-wrap input { flex: 1; width: auto; }
    main { padding: 1rem; }
    .notes-grid { grid-template-columns: 1fr; }
    #pinnedList { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #allSection { margin-top: 1.75rem; padding-top: 1rem; }
    body.is-expanded main { padding: 1rem; }
    body.is-expanded .note-card.expanded {
      padding: 1rem;
      min-height: calc(100vh - 140px);
    }
    body.is-expanded .note-card.expanded .note-title { font-size: 1.25rem; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<div class="status-bar" id="statusBar"></div>

<header>
  <div class="logo">Ламода</div>

  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Поиск..." />
    <select id="searchField">
      <option value="all">Везде</option>
      <option value="title">Только заголовки</option>
      <option value="content">Только текст</option>
    </select>
  </div>

  <div class="token-wrap">
    <input id="tokenInput" type="password" placeholder="GitHub Token" autocomplete="off" />
    <button class="btn small" id="tokenSaveBtn" title="Сохранить токен в этом браузере">Сохранить</button>
    <button class="icon-btn" id="tokenClearBtn" title="Забыть токен">✕</button>
  </div>

  <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
  <button class="btn" id="newBtn">+ Новая</button>
</header>

<main id="main">
  <section id="pinnedSection">
    <h2>📌 Закреплённые</h2>
    <div id="pinnedList" class="notes-grid"></div>
  </section>
  <section id="allSection">
    <h2>Все заметки</h2>
    <div id="notesList" class="notes-grid"></div>
  </section>

  <div id="expandedHost"></div>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   КОНФИГУРАЦИЯ GITHUB
   ========================================================= */
const GITHUB_OWNER  = 'yaroslaveduardov696969-a11y';
const GITHUB_REPO   = 'lamoda-notes1';
const GITHUB_BRANCH = 'main';
const GITHUB_FILE_PATH = 'notes.json';

const GITHUB_API_URL =
  `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;

const THEME_KEY = 'lamoda_theme';
const TOKEN_KEY = 'lamoda_gh_token';

/* =========================================================
   ДИАГНОСТИКА
   ========================================================= */
['searchInput','searchField','newBtn','pinnedList','notesList','toast','themeBtn','statusBar','tokenInput','tokenSaveBtn','tokenClearBtn','expandedHost','pinnedSection','allSection']
  .forEach(id => {
    if (!document.getElementById(id)) console.warn('В HTML отсутствует #' + id);
  });

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let notes = [];
let searchQuery = '';
let searchField = 'all';
let expandedId = null;
let saveInFlight = false;

const MAX_PINNED = 6; // <-- лимит закреплённых

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function nowISO() { return new Date().toISOString(); }
function formatDate(iso) {
  try {
    return new Date(iso).toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch { return ''; }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function pinnedCount() { return notes.filter(n => n.pinned).length; }

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

let statusTimer = null;
function setStatus(msg) {
  const el = document.getElementById('statusBar');
  if (!el) return;
  if (!msg) { el.classList.remove('show'); return; }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

/* =========================================================
   ТОКЕН
   ========================================================= */
function getToken() { return (localStorage.getItem(TOKEN_KEY) || '').trim(); }
function setToken(token) {
  if (token && token.trim()) localStorage.setItem(TOKEN_KEY, token.trim());
  else localStorage.removeItem(TOKEN_KEY);
}

const tokenInput = document.getElementById('tokenInput');
const tokenSaveBtn = document.getElementById('tokenSaveBtn');
const tokenClearBtn = document.getElementById('tokenClearBtn');

if (tokenInput) tokenInput.value = getToken();

if (tokenSaveBtn) {
  tokenSaveBtn.addEventListener('click', async () => {
    const t = (tokenInput.value || '').trim();
    if (!t) { showToast('Введите токен'); return; }
    setToken(t);
    setStatus('Токен сохранён в браузере');
    const loaded = await loadNotesFromGitHub();
    if (loaded !== null) {
      notes = loaded.length ? loaded : notes;
      render();
    }
  });
}

if (tokenClearBtn) {
  tokenClearBtn.addEventListener('click', () => {
    setToken('');
    if (tokenInput) tokenInput.value = '';
    showToast('Токен удалён из браузера');
    setStatus('Токен удалён');
  });
}

/* =========================================================
   GITHUB API
   ========================================================= */
async function loadNotesFromGitHub() {
  const token = getToken();
  if (!token) { setStatus('Токен не указан — работаем локально'); return []; }
  setStatus('Загрузка заметок...');
  try {
    const res = await fetch(GITHUB_API_URL, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
      },
      cache: 'no-store',
    });

    if (res.status === 404) { setStatus('notes.json не найден — будет создан'); return []; }
    if (res.status === 401) {
      setStatus('Токен не принят GitHub (401)');
      showToast('Токен неверный или отозван');
      return null;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    const raw = atob(data.content.replace(/\s/g, ''));
    const json = decodeURIComponent(escape(raw));
    const parsed = JSON.parse(json || '[]');
    setStatus(`Загружено заметок: ${parsed.length}`);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.error('loadNotesFromGitHub:', e);
    setStatus('Ошибка загрузки из GitHub');
    showToast('Не удалось загрузить заметки из GitHub');
    return null;
  }
}

async function saveNotesToGitHub() {
  const token = getToken();
  if (!token) { setStatus('Токен не указан — изменения только локально'); return; }
  if (saveInFlight) { saveNotesToGitHub._again = true; return; }
  saveInFlight = true;
  setStatus('Сохранение...');

  try {
    let sha = null;
    const getRes = await fetch(GITHUB_API_URL, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
      },
      cache: 'no-store',
    });
    if (getRes.ok) { const cur = await getRes.json(); sha = cur.sha; }
    else if (getRes.status === 401) throw new Error('401 — токен не принят');
    else if (getRes.status !== 404) throw new Error(`GET SHA: HTTP ${getRes.status}`);

    const json = JSON.stringify(notes, null, 2);
    const base64 = btoa(unescape(encodeURIComponent(json)));

    const body = {
      message: `Обновление заметок (${new Date().toLocaleString('ru-RU')})`,
      content: base64,
      branch: GITHUB_BRANCH,
    };
    if (sha) body.sha = sha;

    const putRes = await fetch(GITHUB_API_URL, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });

    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      if (putRes.status === 401) throw new Error('401 — токен не принят');
      throw new Error(`PUT: HTTP ${putRes.status} ${err.message || ''}`);
    }

    setStatus('Сохранено в GitHub ✓');
  } catch (e) {
    console.error('saveNotesToGitHub:', e);
    setStatus('Ошибка сохранения');
    showToast('Не удалось сохранить в GitHub');
  } finally {
    saveInFlight = false;
    if (saveNotesToGitHub._again) {
      saveNotesToGitHub._again = false;
      saveNotesToGitHub();
    }
  }
}

/* =========================================================
   РЕНДЕР
   ========================================================= */
const pinnedList = document.getElementById('pinnedList');
const notesList = document.getElementById('notesList');
const expandedHost = document.getElementById('expandedHost');
const pinnedSection = document.getElementById('pinnedSection');
const allSection = document.getElementById('allSection');
const body = document.body;

function matches(note) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  const inTitle = (note.title || '').toLowerCase().includes(q);
  const inContent = (note.content || '').toLowerCase().includes(q);
  if (searchField === 'title') return inTitle;
  if (searchField === 'content') return inContent;
  return inTitle || inContent;
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const safe = escapeHtml(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

function noteCardHTML(note) {
  const q = searchQuery;
  const titleHTML = q ? highlight(note.title || '', q) : escapeHtml(note.title || '');
  const contentHTML = q ? highlight(note.content || '', q) : escapeHtml(note.content || '');

  return `
    <article class="note-card collapsed" data-id="${note.id}">
      <div class="note-title" data-id="${note.id}" data-field="title" tabindex="0">${titleHTML || '<span style="color:var(--text-muted)">Без названия</span>'}</div>
      <div class="note-content" data-id="${note.id}" data-field="content" tabindex="0">${contentHTML || '<span style="color:var(--text-muted)">Пусто</span>'}</div>
      <div class="note-footer">
        <span>${formatDate(note.updatedAt)}</span>
        <div class="note-actions">
          <button class="icon-btn ${note.pinned ? 'pin-active' : ''}" data-action="pin" data-id="${note.id}" title="${note.pinned ? 'Открепить' : 'Закрепить'}">📌</button>
          <button class="icon-btn del" data-action="delete" data-id="${note.id}" title="Удалить">🗑</button>
        </div>
      </div>
    </article>
  `;
}

function expandedCardHTML(note) {
  return `
    <article class="note-card expanded" data-id="${note.id}">
      <button class="expand-back" data-action="collapse" title="Назад (Esc)">← Назад</button>
      <input class="note-title" data-id="${note.id}" data-field="title"
             value="${escapeHtml(note.title || '')}" placeholder="Название..." />
      <textarea class="note-content" data-id="${note.id}" data-field="content"
                placeholder="Текст заметки...">${escapeHtml(note.content || '')}</textarea>
      <div class="note-footer">
        <span>${formatDate(note.updatedAt)}</span>
        <div class="note-actions">
          <button class="icon-btn ${note.pinned ? 'pin-active' : ''}" data-action="pin" data-id="${note.id}" title="${note.pinned ? 'Открепить' : 'Закрепить'}">📌</button>
          <button class="icon-btn del" data-action="delete" data-id="${note.id}" title="Удалить">🗑</button>
        </div>
      </div>
    </article>
  `;
}

function render() {
  if (!pinnedList || !notesList || !expandedHost) return;

  if (expandedId) {
    const note = notes.find(n => n.id === expandedId);
    if (!note) { expandedId = null; }
    else {
      body.classList.add('is-expanded');
      if (pinnedSection) pinnedSection.style.display = 'none';
      if (allSection) allSection.style.display = 'none';
      expandedHost.innerHTML = expandedCardHTML(note);
      bindExpandedEvents();
      return;
    }
  }

  body.classList.remove('is-expanded');
  if (pinnedSection) pinnedSection.style.display = '';
  if (allSection) allSection.style.display = '';
  expandedHost.innerHTML = '';

  const filtered = notes.filter(matches);
  const pinned = filtered.filter(n => n.pinned);
  const others = filtered.filter(n => !n.pinned);

  pinnedList.innerHTML = pinned.length
    ? pinned.map(noteCardHTML).join('')
    : '<p class="empty">Нет закреплённых заметок</p>';

  notesList.innerHTML = others.length
    ? others.map(noteCardHTML).join('')
    : '<p class="empty">' + (notes.length ? 'Ничего не найдено' : 'Пока нет заметок. Нажмите «+ Новая».') + '</p>';

  bindGridEvents();
}

/* =========================================================
   СОБЫТИЯ: сетка
   ========================================================= */
function bindGridEvents() {
  document.querySelectorAll('.note-card.collapsed').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('[data-action]')) return;
      expandedId = card.dataset.id;
      render();
    });
  });

  document.querySelectorAll('.note-card.collapsed [data-action="pin"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      togglePin(btn.dataset.id);
    });
  });

  document.querySelectorAll('.note-card.collapsed [data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteNote(btn.dataset.id);
    });
  });
}

/* =========================================================
   СОБЫТИЯ: расширенная карточка
   ========================================================= */
function bindExpandedEvents() {
  const card = expandedHost.querySelector('.note-card.expanded');
  if (!card) return;
  const note = notes.find(n => n.id === expandedId);
  if (!note) return;

  const backBtn = card.querySelector('[data-action="collapse"]');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      expandedId = null;
      render();
    });
  }

  const titleEl = card.querySelector('.note-title');
  const contentEl = card.querySelector('.note-content');

  let timer = null;
  function scheduleSave() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const n = notes.find(x => x.id === expandedId);
      if (!n) return;
      if (titleEl) n.title = titleEl.value;
      if (contentEl) n.content = contentEl.value;
      n.updatedAt = nowISO();
      const footerSpan = card.querySelector('.note-footer span');
      if (footerSpan) footerSpan.textContent = formatDate(n.updatedAt);
      saveNotesToGitHub();
    }, 500);
  }

  if (titleEl) titleEl.addEventListener('input', scheduleSave);
  if (contentEl) contentEl.addEventListener('input', scheduleSave);

  const pinBtn = card.querySelector('[data-action="pin"]');
  if (pinBtn) {
    pinBtn.addEventListener('click', e => {
      e.stopPropagation();
      togglePin(expandedId);
    });
  }
  const delBtn = card.querySelector('[data-action="delete"]');
  if (delBtn) {
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      deleteNote(expandedId);
    });
  }
}

/* =========================================================
   ДЕЙСТВИЯ
   ========================================================= */
function togglePin(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  if (!note.pinned && pinnedCount() >= MAX_PINNED) {
    showToast(`Можно закрепить не более ${MAX_PINNED} заметок`);
    return;
  }
  note.pinned = !note.pinned;
  note.updatedAt = nowISO();
  saveNotesToGitHub();
  render();
  showToast(note.pinned ? 'Заметка закреплена' : 'Заметка откреплена');
}

function deleteNote(id) {
  if (!confirm('Удалить заметку?')) return;
  notes = notes.filter(n => n.id !== id);
  if (expandedId === id) expandedId = null;
  saveNotesToGitHub();
  render();
  showToast('Заметка удалена');
}

/* =========================================================
   ПОИСК
   ========================================================= */
const searchInputEl = document.getElementById('searchInput');
if (searchInputEl) {
  searchInputEl.addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    if (expandedId) expandedId = null;
    render();
  });
}
const searchFieldEl = document.getElementById('searchField');
if (searchFieldEl) {
  searchFieldEl.addEventListener('change', e => {
    searchField = e.target.value;
    if (expandedId) expandedId = null;
    render();
  });
}

/* =========================================================
   НОВАЯ ЗАМЕТКА
   ========================================================= */
const newBtnEl = document.getElementById('newBtn');
if (newBtnEl) {
  newBtnEl.addEventListener('click', () => {
    const note = { id: uid(), title: '', content: '', pinned: false, updatedAt: nowISO() };
    notes.unshift(note);
    expandedId = note.id;
    render();
    const titleInput = expandedHost.querySelector('.note-title');
    if (titleInput) titleInput.focus();
    saveNotesToGitHub();
  });
}

/* =========================================================
   ТЕМА
   ========================================================= */
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');

function applyTheme(theme) {
  html.dataset.theme = theme;
  if (themeBtn) themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  localStorage.setItem(THEME_KEY, theme);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'light');

if (themeBtn) {
  themeBtn.addEventListener('click', () => {
    applyTheme(html.dataset.theme === 'light' ? 'dark' : 'light');
  });
}

/* =========================================================
   ESC — выход из расширенного режима
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && expandedId) {
    expandedId = null;
    render();
  }
});

/* =========================================================
   СТАРТ
   ========================================================= */
(async function init() {
  const loaded = await loadNotesFromGitHub();

  if (loaded === null) {
    notes = [];
  } else if (loaded.length === 0) {
    notes = [{
      id: uid(),
      title: 'Добро пожаловать в Ламоду',
      content: 'Кликните по заметке, чтобы открыть её на всю страницу. Можно закрепить до 6 заметок — они будут в первой строке компактными карточками.',
      pinned: true,
      updatedAt: nowISO(),
    }];
  } else {
    notes = loaded;
  }

  render();
})();
</script>
</body>
</html>
