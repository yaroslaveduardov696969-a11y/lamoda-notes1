<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ламода</title>
<style>
  /* ---------- Темы ---------- */
    :root,
  [data-theme="light"] {
    --bg: #eaf2fb;
    --surface: #ffffff;
    --surface-2: #dce9f7;
    --text: #132a44;
    --text-muted: #5a7a9e;
    --border: #c5d8ee;
    --accent: #1a73e8;
    --accent-hover: #1558b8;
    --pin: #ffb700;
    --danger: #d93025;
    --mark: #ffe58f;
    --shadow: 0 1px 3px rgba(19, 42, 68, .1);
    --shadow-hover: 0 4px 14px rgba(19, 42, 68, .16);
    --star-opacity: .2;
  }
  [data-theme="dark"] {
    --bg: #0b0b1a;
    --surface: #1c1c2e;
    --surface-2: #262640;
    --text: #f5f5f7;
    --text-muted: #9898b0;
    --border: #2e2e4a;
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --pin: #ffd60a;
    --danger: #ff453a;
    --mark: #6b5a00;
    --shadow: 0 1px 3px rgba(0,0,0,.5);
    --shadow-hover: 0 4px 14px rgba(0,0,0,.7);
    --star-opacity: 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Звёздное небо (CSS) ---------- */
  .stars, .stars2, .stars3 {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: var(--star-opacity);
    transition: opacity .3s;
  }
  /* Слой 1: мелкие частые звёзды */
  .stars {
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 160px 120px, #fff, transparent),
      radial-gradient(1px 1px at 230px 80px, #fff, transparent),
      radial-gradient(1px 1px at 300px 160px, #fff, transparent),
      radial-gradient(1px 1px at 380px 60px, #fff, transparent),
      radial-gradient(1px 1px at 450px 140px, #fff, transparent),
      radial-gradient(1px 1px at 520px 20px, #fff, transparent),
      radial-gradient(1px 1px at 600px 180px, #fff, transparent);
    background-repeat: repeat;
    background-size: 650px 200px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  /* Слой 2: средние звёзды, другой ритм */
  .stars2 {
    background-image:
      radial-gradient(1.5px 1.5px at 50px 50px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 200px 130px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 350px 70px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 500px 170px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 650px 30px, #cfe8ff, transparent);
    background-repeat: repeat;
    background-size: 750px 220px;
    animation: twinkle 6s ease-in-out infinite alternate-reverse;
  }
  /* Слой 3: крупные редкие, с лёгким свечением */
  .stars3 {
    background-image:
      radial-gradient(2px 2px at 120px 90px, #ffffff, transparent),
      radial-gradient(2px 2px at 420px 150px, #ffffff, transparent),
      radial-gradient(2px 2px at 700px 40px, #ffffff, transparent);
    background-repeat: repeat;
    background-size: 900px 260px;
    animation: twinkle 8s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: calc(var(--star-opacity) * .6); }
    100% { opacity: var(--star-opacity); }
  }
  /* В светлой теме звёзды почти не видны — это нормально */

  /* ---------- Шапка ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.5rem;
    display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
    box-shadow: var(--shadow);
  }
  .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; margin-right: .5rem; }
  .search-wrap { display: flex; gap: .5rem; flex: 1; min-width: 260px; }
  .search-wrap input {
    flex: 1; padding: .5rem .75rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--text);
    font-size: .95rem; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap select {
    padding: .5rem .6rem; border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font-size: .9rem; cursor: pointer;
  }
  .btn {
    padding: .5rem .9rem; border-radius: 8px; border: none;
    background: var(--accent); color: #fff;
    font-size: .9rem; font-weight: 500; cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .icon-btn {
    width: 36px; height: 36px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.1rem; border-radius: 8px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--border); }

  /* ---------- Контент ---------- */
  main { position: relative; z-index: 1; padding: 1.25rem 1.5rem 3rem; max-width: 1280px; margin: 0 auto; }
  h2 {
    font-size: .95rem; font-weight: 600; color: var(--text-muted);
    margin: 1.25rem 0 .75rem; text-transform: uppercase; letter-spacing: .04em;
  }
  h2:first-child { margin-top: 0; }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  /* ---------- Карточка ---------- */
  .note-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    display: flex; flex-direction: column; gap: .5rem;
    box-shadow: var(--shadow);
    transition: box-shadow .2s, border-color .2s;
    position: relative;
  }
  .note-card:hover { box-shadow: var(--shadow-hover); }
  /* Оранжевой рамки у закреплённых больше нет */

  .note-title {
    font-weight: 600; font-size: 1.05rem;
    border: none; outline: none; background: transparent;
    color: var(--text); width: 100%; padding: .2rem;
    border-radius: 6px;
  }
  .note-title:focus { background: var(--surface-2); }

  .note-content {
    border: none; outline: none; background: transparent;
    color: var(--text); width: 100%;
    font-family: inherit; font-size: .93rem; line-height: 1.45;
    padding: .2rem; border-radius: 6px;
    resize: none; overflow: hidden;
    min-height: 2.9em;
  }
  .note-content:focus { background: var(--surface-2); }

  .note-card.collapsed .note-content {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: text;
  }
  .note-card.editing .note-content {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
    min-height: 8em;
  }

  .note-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: .78rem; color: var(--text-muted);
    margin-top: auto; padding-top: .25rem; gap: .5rem;
  }
  .note-actions { display: flex; gap: .25rem; }
  .note-actions .icon-btn { width: 30px; height: 30px; font-size: .95rem; }
  .note-actions .icon-btn.pin-active { color: var(--pin); }
  .note-actions .icon-btn.del:hover { color: var(--danger); border-color: var(--danger); }

  mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }
  .empty { color: var(--text-muted); font-style: italic; font-size: .9rem; padding: .5rem 0; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(120%);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: .7rem 1.1rem; font-size: .9rem;
    box-shadow: var(--shadow-hover); z-index: 100;
    transition: transform .3s ease; opacity: 0;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ---------- Адаптив ---------- */
  @media (max-width: 640px) {
    header { padding: .6rem 1rem; }
    .search-wrap { order: 3; flex-basis: 100%; }
    main { padding: 1rem; }
    .notes-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Звёздное небо -->
<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<header>
  <div class="logo">Ламода</div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Поиск..." />
    <select id="searchField">
      <option value="all">Везде</option>
      <option value="title">Только заголовки</option>
      <option value="content">Только текст</option>
    </select>
  </div>
  <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
  <button class="btn" id="newBtn">+ Новая</button>
</header>

<main>
  <section>
    <h2>📌 Закреплённые</h2>
    <div id="pinnedList" class="notes-grid"></div>
  </section>
  <section>
    <h2>Все заметки</h2>
    <div id="notesList" class="notes-grid"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ХРАНИЛИЩЕ
   ========================================================= */
const STORAGE_KEY = 'lamoda_notes_v1';
const THEME_KEY = 'lamoda_theme';

function loadNotes() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveNotes() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}

let notes = loadNotes();

/* Стартовые заметки при первом заходе */
if (notes.length === 0) {
  const now = new Date().toISOString();
  notes = [
    { id: uid(), title: 'Добро пожаловать в Ламоду',
      content: 'Это ваша первая заметка. Редактируйте прямо здесь — изменения сохраняются автоматически. Закрепить можно до 3 заметок.',
      pinned: true, updatedAt: now },
    { id: uid(), title: 'Список покупок',
      content: 'Молоко, хлеб, яйца, сыр, помидоры, огурцы, зелень, масло, кофе.',
      pinned: false, updatedAt: now },
  ];
  saveNotes();
}

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function nowISO() { return new Date().toISOString(); }
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pinnedCount() { return notes.filter(n => n.pinned).length; }

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

/* =========================================================
   СОСТОЯНИЕ UI
   ========================================================= */
let searchQuery = '';
let searchField = 'all';
let editingId = null; // id заметки, которая сейчас редактируется

/* =========================================================
   РЕНДЕР
   ========================================================= */
const pinnedList = document.getElementById('pinnedList');
const notesList = document.getElementById('notesList');

function matches(note) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  const inTitle = note.title.toLowerCase().includes(q);
  const inContent = note.content.toLowerCase().includes(q);
  if (searchField === 'title') return inTitle;
  if (searchField === 'content') return inContent;
  return inTitle || inContent;
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const safe = escapeHtml(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

function noteCardHTML(note, isEditing) {
  const q = searchQuery;
  const showHighlight = q && !isEditing;
  const titleHTML = showHighlight ? highlight(note.title, q) : escapeHtml(note.title);
  const contentHTML = showHighlight ? highlight(note.content, q) : escapeHtml(note.content);

  // Заголовок: если редактируем — input, иначе div (чтобы подсветка работала)
  const titleBlock = isEditing
    ? `<input class="note-title" data-id="${note.id}" data-field="title" value="${escapeHtml(note.title)}" placeholder="Название..." />`
    : `<div class="note-title" data-id="${note.id}" data-field="title" tabindex="0">${titleHTML || '<span style="color:var(--text-muted)">Без названия</span>'}</div>`;

  // Контент: если редактируем — textarea, иначе div с обрезкой
  const contentBlock = isEditing
    ? `<textarea class="note-content" data-id="${note.id}" data-field="content" placeholder="Текст заметки...">${escapeHtml(note.content)}</textarea>`
    : `<div class="note-content" data-id="${note.id}" data-field="content" tabindex="0">${contentHTML || '<span style="color:var(--text-muted)">Пусто</span>'}</div>`;

  return `
    <article class="note-card ${isEditing ? 'editing' : 'collapsed'}" data-id="${note.id}">
      ${titleBlock}
      ${contentBlock}
      <div class="note-footer">
        <span>${formatDate(note.updatedAt)}</span>
        <div class="note-actions">
          <button class="icon-btn ${note.pinned ? 'pin-active' : ''}" data-action="pin" data-id="${note.id}" title="${note.pinned ? 'Открепить' : 'Закрепить'}">📌</button>
          <button class="icon-btn del" data-action="delete" data-id="${note.id}" title="Удалить">🗑</button>
        </div>
      </div>
    </article>
  `;
}

function render() {
  const filtered = notes.filter(matches);
  const pinned = filtered.filter(n => n.pinned);
  const others = filtered.filter(n => !n.pinned);

  pinnedList.innerHTML = pinned.length
    ? pinned.map(n => noteCardHTML(n, n.id === editingId)).join('')
    : '<p class="empty">Нет закреплённых заметок</p>';

  notesList.innerHTML = others.length
    ? others.map(n => noteCardHTML(n, n.id === editingId)).join('')
    : '<p class="empty">' + (notes.length ? 'Ничего не найдено' : 'Пока нет заметок. Нажмите «+ Новая».') + '</p>';

  bindEvents();
}

/* =========================================================
   СОБЫТИЯ
   ========================================================= */
function bindEvents() {
  // Клик по заголовку/контенту в свёрнутом режиме — вход в редактирование
  document.querySelectorAll('.note-card.collapsed .note-title, .note-card.collapsed .note-content').forEach(el => {
    el.addEventListener('click', () => {
      editingId = el.dataset.id;
      render();
      // фокус в нужное поле
      const card = document.querySelector(`.note-card[data-id="${editingId}"]`);
      const target = card.querySelector(el.dataset.field === 'title' ? '.note-title' : '.note-content');
      if (target) { target.focus(); target.setSelectionRange?.(target.value.length, target.value.length); }
    });
  });

  // Редактирование: input/textarea с автосохранением
  document.querySelectorAll('.note-card.editing .note-title, .note-card.editing .note-content').forEach(el => {
    let timer = null;
    el.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const note = notes.find(n => n.id === el.dataset.id);
        if (!note) return;
        note[el.dataset.field] = el.value;
        note.updatedAt = nowISO();
        saveNotes();
        // обновляем только дату, чтобы не терять фокус
        const card = document.querySelector(`.note-card[data-id="${note.id}"]`);
        if (card) card.querySelector('.note-footer span').textContent = formatDate(note.updatedAt);
      }, 400);
    });
    // Выход из редактирования по Esc или клику вне карточки
    el.addEventListener('keydown', e => {
      if (e.key === 'Escape') { editingId = null; render(); }
    });
  });

  // Клик вне редактируемой карточки — выйти из редактирования
  document.addEventListener('click', e => {
    if (!editingId) return;
    const card = e.target.closest('.note-card');
    if (!card || card.dataset.id !== editingId) {
      editingId = null;
      render();
    }
  }, { capture: true });

  // Кнопка «Закрепить/Открепить»
  document.querySelectorAll('[data-action="pin"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const note = notes.find(n => n.id === id);
      if (!note) return;

      if (!note.pinned && pinnedCount() >= 3) {
        showToast('Можно закрепить не более 3 заметок');
        return;
      }
      note.pinned = !note.pinned;
      note.updatedAt = nowISO();
      saveNotes();
      render();
      showToast(note.pinned ? 'Заметка закреплена' : 'Заметка откреплена');
    });
  });

  // Кнопка «Удалить»
  document.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      if (!confirm('Удалить заметку?')) return;
      notes = notes.filter(n => n.id !== id);
      if (editingId === id) editingId = null;
      saveNotes();
      render();
      showToast('Заметка удалена');
    });
  });
}

/* =========================================================
   ПОИСК
   ========================================================= */
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});
document.getElementById('searchField').addEventListener('change', e => {
  searchField = e.target.value;
  render();
});

/* =========================================================
   НОВАЯ ЗАМЕТКА
   ========================================================= */
document.getElementById('newBtn').addEventListener('click', () => {
  const note = { id: uid(), title: '', content: '', pinned: false, updatedAt: nowISO() };
  notes.unshift(note);
  saveNotes();
  editingId = note.id;
  render();
  const card = document.querySelector(`.note-card[data-id="${note.id}"]`);
  card?.querySelector('.note-title')?.focus();
});

/* =========================================================
   ТЕМА
   ========================================================= */
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');

function applyTheme(theme) {
  html.dataset.theme = theme;
  themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  localStorage.setItem(THEME_KEY, theme);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'light');

themeBtn.addEventListener('click', () => {
  applyTheme(html.dataset.theme === 'light' ? 'dark' : 'light');
});

/* =========================================================
   СТАРТ
   ========================================================= */
render();
</script>
</body>
</html>
